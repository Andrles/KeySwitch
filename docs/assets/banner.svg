<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">KeySwitch</title>
  <desc id="desc">Automatic Russian and English keyboard layout switching for macOS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1280" height="460" rx="32" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="260" fill="#A78BFA" opacity=".12"/>
  <circle cx="160" cy="500" r="300" fill="#38BDF8" opacity=".1"/>

  <g transform="translate(86 76)">
    <rect width="108" height="108" rx="27" fill="#7C3AED" stroke="#C4B5FD" stroke-opacity=".45" filter="url(#shadow)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="22" y="30" width="64" height="48" rx="8"/>
      <path d="M31 43h4m10 0h4m10 0h4m10 0h4M31 55h4m10 0h4m10 0h4m10 0h4M35 67h38"/>
    </g>
  </g>

  <text x="230" y="142" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="750" letter-spacing="-2">KeySwitch</text>
  <text x="232" y="191" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">Умное переключение раскладки для macOS</text>

  <g transform="translate(232 245)" filter="url(#shadow)">
    <rect width="190" height="94" rx="20" fill="url(#key)" stroke="#FFFFFF" stroke-opacity=".24"/>
    <text x="95" y="41" text-anchor="middle" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650">EN</text>
    <text x="95" y="71" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">Ghbdtn</text>
  </g>
  <text x="468" y="303" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="39">→</text>
  <g transform="translate(530 245)" filter="url(#shadow)">
    <rect width="190" height="94" rx="20" fill="url(#key)" stroke="#FFFFFF" stroke-opacity=".24"/>
    <text x="95" y="41" text-anchor="middle" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650">RU</text>
    <text x="95" y="71" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Привет</text>
  </g>

  <g transform="translate(800 106)">
    <rect width="376" height="234" rx="26" fill="#0F172A" fill-opacity=".55" stroke="#FFFFFF" stroke-opacity=".14"/>
    <text x="34" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="650">Создано для macOS</text>
    <g fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">
      <text x="34" y="96">✓ Русский ↔ English</text>
      <text x="34" y="132">✓ Проверка орфографии</text>
      <text x="34" y="168">✓ Работа из строки меню</text>
      <text x="34" y="204">✓ Полностью офлайн</text>
    </g>
  </g>
  <text x="86" y="410" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Native Swift · Apple Silicon + Intel · macOS 13+</text>
</svg>

