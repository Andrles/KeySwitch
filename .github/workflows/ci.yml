name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5
      
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Test language engine
        run: ./scripts/test.sh

      - name: Build universal app
        run: ./scripts/build.sh

      - name: Package
        run: ./scripts/package.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeySwitch
          path: |
            build/KeySwitch-*.zip
            build/KeySwitch-*.pkg
            build/KeySwitch-*.dmg
          if-no-files-found: error
