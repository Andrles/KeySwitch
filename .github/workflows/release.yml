name: Draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

     - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Test
        run: ./scripts/test.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Package
        run: ./scripts/package.sh

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            build/KeySwitch-*.zip
            build/KeySwitch-*.pkg
            build/KeySwitch-*.dmg
