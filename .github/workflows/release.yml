name: Build release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Test
        run: ./scripts/test.sh
      - name: Build
        run: ./scripts/build.sh
      - name: Test installer scripts and download selection
        run: ./scripts/test-installer.sh
      - name: Package
        run: ./scripts/package.sh
      - name: Store CI candidate separately from published installers
        uses: actions/upload-artifact@v4
        with:
          name: CI-KeySwitch-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            build/KeySwitch-*.zip
            build/KeySwitch-*.pkg
            build/KeySwitch-*.dmg
